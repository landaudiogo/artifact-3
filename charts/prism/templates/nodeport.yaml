apiVersion: v1
kind: Service
metadata:
  name: sample-clickhouse-nodeport
spec:
  type: NodePort
  selector:
    app: sample-clickhouse
  externalIPs: [ "10.0.0.1" ]
  ports:
    - nodePort: {{ .Values.clickhouse.nodePort.tcp }}
      port: 9000
      targetPort: 9000
      name: tcp
    - nodePort: {{ .Values.clickhouse.nodePort.http }}
      port: 8123
      targetPort: 8123
      name: http
