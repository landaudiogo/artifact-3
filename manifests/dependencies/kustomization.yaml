apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: chaos-mesh
    repo: https://charts.chaos-mesh.org
    releaseName: chaos-mesh
    namespace: faults
    includeCRDs: true
    version: 2.8.3
    valuesFile: ./chaos-mesh-values.yaml

resources:
  - ./cert-manager.yaml
  - ./clickhouse-operator.yaml
  - ./prometheus.yaml
  - ./faults.yaml
  - ./openebs

patches:
  - path: ./patches/chaos-mesh.yaml
