apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openebs

helmCharts:
  - name: lvm-localpv
    repo: https://openebs.github.io/lvm-localpv
    releaseName: openebs
    namespace: openebs
    includeCRDs: true
    version: 1.9.1
    valuesFile: ./openebs-values.yaml

resources:
  - ./namespace.yaml

patches:
  - path: ./patches/daemonset.yml
