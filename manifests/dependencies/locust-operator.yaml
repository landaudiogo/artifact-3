# Source: locust-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-operator
  labels:
    helm.sh/chart: locust-operator-0.1.6
    app.kubernetes.io/name: locust-operator
    app.kubernetes.io/instance: locust-operator
    app.kubernetes.io/version: "0.1.6"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: locust-operator
      app.kubernetes.io/instance: locust-operator
  template:
    metadata:
      labels:
        helm.sh/chart: locust-operator-0.1.6
        app.kubernetes.io/name: locust-operator
        app.kubernetes.io/instance: locust-operator
        app.kubernetes.io/version: "0.1.6"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: locust-operator
      containers:
        - name: locust-operator
          image: "locustio/operator:0.1.6"
          imagePullPolicy: IfNotPresent
          args: ["--all-namespaces"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
