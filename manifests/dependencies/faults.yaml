apiVersion: v1
kind: Namespace
metadata:
  name: faults

---
kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: faults
  name: account-cluster-manager-jfheo

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: role-cluster-manager-jfheo
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-cluster-manager-jfheo
subjects:
- kind: ServiceAccount
  name: account-cluster-manager-jfheo
  namespace: faults
roleRef:
  kind: ClusterRole
  name: role-cluster-manager-jfheo
  apiGroup: rbac.authorization.k8s.io
