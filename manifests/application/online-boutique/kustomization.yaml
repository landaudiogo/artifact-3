apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: online-boutique

helmGlobals:
 chartHome: ../../../charts

helmCharts:
  - name: online-boutique
    releaseName: online-boutique
    namespace: online-boutique
    valuesFile: values.yaml

resources:
  - ./namespace.yaml
  - ./jaeger.yaml

patches:
  - path: ./patches/opentelemetry.yaml
  - path: ./patches/images.yaml
  - path: ./patches/deployment-node.yaml
  - path: ./patches/no-resources.yaml
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
        namespace: online-boutique
# adservice - not yet implemented
# checkoutservice - tracing, profiler
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
        namespace: online-boutique
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                - name: COLLECTOR_SERVICE_ADDR
                  value: "opentelemetrycollector:4317"
                - name: OTEL_SERVICE_NAME
                  value: "checkoutservice"
                - name: ENABLE_TRACING
                  value: "1"
                # - name: ENABLE_PROFILER
                #   value: "1"
  # currencyservice - tracing, profiler
