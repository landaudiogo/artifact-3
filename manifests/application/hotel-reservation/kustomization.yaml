apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-reservation

helmGlobals:
 chartHome: ../../../charts

helmCharts:
  - name: hotelreservation
    releaseName: hotel-reservation
    namespace: hotel-reservation
    valuesFile: values.yaml

resources:
  - ./namespace.yaml
  - ./jaeger.yaml

patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: jaeger
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jaeger-hotel-reservation-hotelres
  - path: ./patches/deployment-node.yaml
  # - path: ./patches/no-resources.yaml
#   - path: ./patches/resources.yaml
