apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: social-network

helmGlobals:
 chartHome: ../../../charts

helmCharts:
  - name: socialnetwork
    releaseName: socialnetwork
    namespace: social-network
    valuesFile: values.yaml

resources:
  - ./namespace.yaml
  - ./jaeger.yaml
  - ./init-job.yaml
  - ./resources/media-mongodb.yaml
  - ./resources/post-storage-mongodb.yaml
  - ./resources/social-graph-mongodb.yaml
  - ./resources/url-shorten-mongodb.yaml
  - ./resources/user-mongodb.yaml
  - ./resources/user-timeline-mongodb.yaml

patches:
  - path: ./patches/nginx-thrift.yaml
  - path: ./patches/resources.yaml
  - path: ./patches/deployment-node.yaml
  # - path: ./patches/no-resources.yaml
  - path: ./patches/media-mongodb.yaml
  - path: ./patches/post-storage-mongodb.yaml
  - path: ./patches/social-graph-mongodb.yaml
  - path: ./patches/url-shorten-mongodb.yaml
  - path: ./patches/user-mongodb.yaml
  - path: ./patches/user-timeline-mongodb.yaml
