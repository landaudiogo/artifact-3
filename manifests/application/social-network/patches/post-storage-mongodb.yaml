apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-storage-mongodb
  namespace: social-network
spec:
  template:
    spec:
      containers:
      - name: post-storage-mongodb
        volumeMounts:
        - name: datadir
          mountPath: /data/db
      volumes:
      - name: datadir
        persistentVolumeClaim:
          claimName: post-storage-pvc
