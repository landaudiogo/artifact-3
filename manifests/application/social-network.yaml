---
apiVersion: v1
kind: Namespace
metadata:
  name: social-network
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-thrift
  namespace: social-network
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nginx-thrift
  template:
    metadata:
      labels:
        name: nginx-thrift
      name: nginx-thrift
    spec:
      containers:
      - image: hypercube/social-network-ml-nginx:latest@sha256:6ac95749cb7aff055735ce490c7e702d1dabf8b6262c87d52d49b8ef4377833a
        name: nginx-thrift
      - args:
        - --listen
        - 127.0.0.1:53
        - --default-resolver
        - --append-search-domains
        image: janeczku/go-dnsmasq:release-1.0.7@sha256:3a99ad92353b55e97863812470e4f7403b47180f06845fdd06060773fe04184f
        name: dnsmasq
      enableServiceLinks: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-thrift
  namespace: social-network
spec:
  ports:
  - nodePort: 30001
    port: 8080
  selector:
    name: nginx-thrift
  type: NodePort
