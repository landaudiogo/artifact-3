apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-entrypoint
data:
  entrypoint.sh: |
    #!/bin/bash

    set -e

    BLOCKDEV="/bdev/lvma"
    DMNAME="poddelay_${POD_UID}"
    MONGODIR="/data/db"

    # This environment variable was required for dmsetup to create the 
    # /dev/mapper/... file in the container filesystem
    export DM_DISABLE_UDEV=1 

    setup_block_device () {
        if dmsetup info "$DMNAME" >/dev/null 2>&1; then
            echo "device-mapper device $DMNAME exists. Attempting remove."
            dmsetup remove "$DMNAME"
        fi

        echo "Create device-mapper $DMNAME device"
        dmsetup \
            create "$DMNAME" --table \
            "0 $(blockdev --getsize "$BLOCKDEV") delay "$BLOCKDEV" 0 0"

        if ! blkid "/dev/mapper/$DMNAME"; then
            echo "Create ext4 filesystem on /dev/mapper/$DMNAME"
            mkfs.ext4 "/dev/mapper/$DMNAME"
        fi

        if [ ! -d "$MONGODIR" ]; then
            echo "Create directory $MONGODIR"
            mkdir -p "$MONGODIR"
        fi

        echo "Mount /dev/mapper/$DMNAME -> $MONGODIR"
        mount "/dev/mapper/$DMNAME" "$MONGODIR"
    }

    handle_term () {
        echo "SIGTERM handler"
        echo "mongod pid: $mongod_pid"
        kill -SIGTERM $mongod_pid
        wait $mongod_pid
        mongo_exit=$?
        
        echo "umount $MONGODIR"
        umount "$MONGODIR"

        echo "remove dm device $DMNAME"
        dmsetup remove "$DMNAME"

        exit $mongo_exit
    }

    setup_block_device
    trap handle_term SIGTERM

    docker-entrypoint.sh mongod &
    mongod_pid=$!
    echo "Store mongod: $mongod_pid"
    wait $mongod_pid
    handle_term
