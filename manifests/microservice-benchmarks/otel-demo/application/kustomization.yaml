apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: otel-demo

helmCharts:
  - name: opentelemetry-demo
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.40.9
    releaseName: opentelemetry-demo
    namespace: otel-demo
    valuesFile: ./values.yaml

resources:
  - ./namespace.yaml
  - ./jaeger.yaml
  - ./resources/postgresql.yaml

patches:
  - path: ./patches/otel-collector-agent.yaml
  - path: ./patches/jaeger-user-config.yaml
  - path: ./patches/resources.yaml
  - path: ./patches/deployment-node.yaml
  # - path: ./patches/no-resources.yaml
  - path: ./patches/postgresql.yaml
