apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-geo-hotel-reservation-hotelres
spec:
  template:
    spec:
      containers:
      - name: hotel-reserv-geo-mongo
        securityContext:
          privileged: true  
        command: ["/entrypoint.sh"]
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        volumeMounts:
        - name: entrypoint
          mountPath: /entrypoint.sh
          subPath: entrypoint.sh
        volumeDevices:
        - devicePath: /bdev/lvma
          name: datadir
      volumes:
      - name: entrypoint
        configMap:
          name: mongo-entrypoint
          defaultMode: 0555
      - name: datadir
        persistentVolumeClaim:
          claimName: geo-pvc
---
