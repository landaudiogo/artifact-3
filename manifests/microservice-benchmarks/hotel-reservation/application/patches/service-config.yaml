apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-hotel-reservation-hotelres
spec:
  template:
    spec:
      containers:
      - name: hotel-reserv-geo
        volumeMounts:
        - name: service-config
          mountPath: /workspace/config.json
          subPath: config.json
      volumes:
      - name: service-config
        configMap:
          name: service-config
---
