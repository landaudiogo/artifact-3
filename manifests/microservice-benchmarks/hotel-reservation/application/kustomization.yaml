apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-reservation

helmGlobals:
 chartHome: ../helm-charts

helmCharts:
  - name: hotelreservation
    releaseName: hotel-reservation
    namespace: hotel-reservation
    valuesFile: values.yaml

resources:
  - ./resources/namespace.yaml
  - ./resources/jaeger.yaml
  - ./resources/service-config.yaml
  - ./resources/mongodb-pvc.yaml
  - ./resources/mongodb-entrypoint.yaml

patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: jaeger
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jaeger-hotel-reservation-hotelres
  - path: ./patches/deployment-node.yaml
  - path: ./patches/resources.yaml
  # - path: ./patches/no-resources.yaml
  - path: ./patches/service-config.yaml
  - path: ./patches/mongodb.yaml
