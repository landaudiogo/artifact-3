apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: social-network

helmGlobals:
 chartHome: ../helm-charts

helmCharts:
  - name: socialnetwork
    releaseName: socialnetwork
    namespace: social-network
    valuesFile: values.yaml

resources:
  - ./resources/namespace.yaml
  - ./resources/jaeger.yaml
  - ./resources/init-job.yaml
  - ./resources/mongodb-pvc.yaml
  - ./resources/mongo-entrypoint.yaml

patches:
  - path: ./patches/nginx-thrift.yaml
  - path: ./patches/resources.yaml
  - path: ./patches/deployment-node.yaml
  # - path: ./patches/no-resources.yaml
  - path: ./patches/mongodb.yaml
