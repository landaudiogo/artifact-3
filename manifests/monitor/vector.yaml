apiVersion: batch/v1
kind: Job
metadata:
  name: ch-vector-schema
  namespace: monitoring
spec:
  completions: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait-for-clickhouse
          image: clickhouse/clickhouse-server:25.12
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: default-password
                  key: password
          command:
            - sh
            - -c
            - |
              while ! wget --spider --no-check-certificate -T 1 -q "http://ch-cluster-clickhouse-headless:8123/ping" 2>/dev/null; do
                echo "Waiting for ClickHouse..."
                sleep 1
              done
              echo "ClickHouse is up — applying schema..."
              sleep 10

              clickhouse-client -h clickhouse --port 9000 --user default --password "$(echo $CLICKHOUSE_PASSWORD)" -n <<EOF
              CREATE OR REPLACE TABLE default.logs (
                  timestamp String,
                  kubernetes String,
                  message String,
                  stream String,
              )
              ENGINE = MergeTree()
              ORDER BY tuple()
              EOF

              result="$(clickhouse-client -h clickhouse --port 9000 --user default --password "$(echo $CLICKHOUSE_PASSWORD)" -q "select count(*) from information_schema.tables where table_schema='default' and table_name='logs'")"
              
              if [[ "$result" -eq "1" ]]; then
              echo "Success: default schema contains 'logs' table"
                exit 0
              else
                echo "Failure: default schema is missing 'logs' table"
                exit 1
              fi
