# helm install prometheus -n monitoring \
#   --create-namespace \
#   prometheus-community/kube-prometheus-stack \
#   -f prometheus-values.yaml

coreDns:
  serviceMonitor:
    port: http-metrics
  service:
    port: 10055
    targetPort: 10055

prometheus:
  prometheusSpec:
    enableOTLPReceiver: true
    nodeSelector:
      "kubernetes.io/hostname": "k8s-master"
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        value: "true"
      - effect: NoSchedule
        key: unschedulable
        value: "true"
  service:
    type: NodePort
    nodePort: 30954
    
alertmanager:
  enabled: false

grafana:
  enabled: true
  service:
    type: NodePort
    nodePort: 30007
  adminUser: admin
  adminPassword: admin-password

kubelet:
  serviceMonitor:
    interval: 15s
    cAdvisorMetricRelabelings: null
