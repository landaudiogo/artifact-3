apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: partition
  namespace: faults
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      'app': 'productcatalogservice'
  direction: from
  externalTargets:
    - "10.0.0.0/8"
  duration: 15s
