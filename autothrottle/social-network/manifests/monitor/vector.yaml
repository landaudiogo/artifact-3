---
# Source: vector/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: monitoring
  labels:
    helm.sh/chart: vector-0.52.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: "0.55.0-distroless-libc"
    app.kubernetes.io/managed-by: Helm
    
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ch-vector-schema
  namespace: monitoring
spec:
  completions: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait-for-clickhouse
          image: clickhouse/clickhouse-server:25.12
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: default-password
                  key: password
          command:
            - sh
            - -c
            - |
              while ! wget --spider --no-check-certificate -T 1 -q "http://sample-clickhouse-headless:8123/ping" 2>/dev/null; do
                echo "Waiting for ClickHouse..."
                sleep 1
              done
              echo "ClickHouse is up — applying schema..."
              sleep 10

              clickhouse-client -h clickhouse --port 9000 --user default --password "$(echo $CLICKHOUSE_PASSWORD)" -n <<EOF
              CREATE OR REPLACE TABLE default.logs (
                  timestamp String,
                  kubernetes String,
                  message String,
                  stream String,
              )
              ENGINE = MergeTree()
              ORDER BY tuple()
              EOF

              result="$(clickhouse-client -h clickhouse --port 9000 --user default --password "$(echo $CLICKHOUSE_PASSWORD)" -q "select count(*) from information_schema.tables where table_schema='default' and table_name='logs'")"
              
              if [[ "$result" -eq "1" ]]; then
              echo "Success: default schema contains 'logs' table"
                exit 0
              else
                echo "Failure: default schema is missing 'logs' table"
                exit 1
              fi
---
# Source: vector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: monitoring
  labels:
    helm.sh/chart: vector-0.52.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: "0.55.0-distroless-libc"
    app.kubernetes.io/managed-by: Helm
    
data:
  vector.yaml: |
    api:
      address: 0.0.0.0:8686
      enabled: true
    data_dir: /vector-data-dir
    sinks:
      clickhouse:
        auth:
          password: secret-password
          strategy: basic
          user: default
        database: default
        endpoint: http://sample-clickhouse-headless:8123
        format: json_each_row
        inputs:
        - k8s_logs
        table: logs
        type: clickhouse
      console:
        encoding:
          codec: json
        inputs:
        - k8s_logs
        type: console
    sources:
      k8s_logs:
        extra_label_selector: name!=jaeger
        extra_namespace_label_selector: kubernetes.io/metadata.name==social-network
        type: kubernetes_logs
